# Sample theme pack — public feeds only.
#
# This exists so anyone who clones the repository can run the pipeline without
# owning any private configuration. It is deliberately minimal: it proves the
# engine works, it is not a curated product.
#
# No Google Alert feeds here. Those are personal, cannot be rotated, and belong
# in a private theme pack that injects them through url_env. See README.
#
# Categories are listed in display order; keys must match ^[a-z][a-z0-9_]*$.
# Each category may also set:
#   profile           extra rules from rules.yaml: ai_dev | food | egg (default: none)
#   translate         send English articles to the translation batch (default: false)
#   preserve_subject  a translated title must keep the original subject (default: false)
#   source_limit      most of the 10 articles one source may fill (default: no limit)
# The keys business / food / ai_dev / egg keep their historical defaults when
# these are left out, which is why this pack does not set them.
categories:
  business:
    label: "経済・ビジネス"
    sources:
      # NHK 経済 (cat5.xml) は 2026-08-07 から更新が止まっているため外した（#41）。
      - name: "ITmedia ビジネス"
        source_type: "rss"
        url: "https://rss.itmedia.co.jp/rss/2.0/business.xml"
      - name: "東洋経済オンライン"
        source_type: "rss"
        url: "https://toyokeizai.net/list/feed/rss"
  food:
    label: "スイーツ・飲食"
    focus: "外食、スイーツ、新商品、限定メニュー"
    sources:
      - name: "グルメ Watch"
        source_type: "rss"
        url: "https://gourmet.watch.impress.co.jp/data/rss/1.0/grw/feed.rdf"
      - name: "えん食べ"
        source_type: "rss"
        url: "https://entabe.jp/news/feed.rss"
  ai_dev:
    label: "AI・活用"
    focus: "生成AIの活用事例、開発ツール、AIトレンド"
    sources:
      - name: "Zenn AI"
        source_type: "rss"
        url: "https://zenn.dev/topics/ai/feed"
      - name: "OpenAI Blog"
        source_type: "rss"
        url: "https://openai.com/news/rss.xml"
  egg:
    label: "卵・食品開発"
    focus: "食品の商品開発、製法、素材"
    sources:
      - name: "Food Dive"
        source_type: "rss"
        url: "https://www.fooddive.com/feeds/news/"
        region: "global"
      - name: "Food Navigator"
        source_type: "rss"
        url: "https://www.foodnavigator.com/Info/Latest-News/RSS"
        region: "global"
