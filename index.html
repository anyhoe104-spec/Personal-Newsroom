<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Personal-Newsroom</title>
  <meta name="theme-color" content="#123e35">
  <meta name="description" content="ニュースを評価して、あなたの関心に育てるパーソナルニュースルーム。">

  <link rel="icon" href="./icon.svg" type="image/svg+xml">

<body>
  <a class="skip-link" href="#app">記事一覧へ</a>
  <header class="app-header">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">N.</span><span>PERSONAL<br>NEWSROOM</span></a>
    <button id="openSettings" class="settings-button" type="button" data-i18n="reader.settings">設定</button>
  </header>
  <div class="page-shell">
    <section class="hero">
      <p class="eyebrow">YOUR DAILY PERSPECTIVE</p>
      <h1 data-i18n="header.headline">今日の視点を、育てる。</h1>
      <p class="intro" data-i18n="reader.intro">読む。選ぶ。自分の視点が育つ。</p>
      <p class="updated"><span data-i18n="header.updated_label">更新:</span> <time id="generatedAt"></time></p>
      <p id="learningCount" class="learning-count"></p>
    </section>
    <p id="offline" class="banner" hidden data-i18n="reader.offline">オフラインです。</p>
    <p id="freshness" class="banner" hidden data-i18n="reader.freshness">記事の日付をご確認ください。</p>
    <div class="section-heading"><h2 id="viewTitle"></h2><p id="resultCount" role="status"></p></div>
    <div class="category-nav"><p class="category-caption" data-i18n="reader.category_filter"></p><nav class="tabs" id="tabs" aria-label="カテゴリ" data-i18n-attr="aria-label:nav.categories_aria_label"></nav></div>
    <section id="filters" class="filters" aria-label="記事の絞り込み">
      <label class="search-box"><span class="sr-only" data-i18n="reader.search">記事・情報源を検索</span><input id="search" type="search" placeholder="記事・情報源を検索" data-i18n-attr="placeholder:reader.search" autocomplete="off"></label>

      <label class="check-label"><input id="unread" type="checkbox"><span data-i18n="reader.unread">未読のみ</span></label>
      <button id="refreshRanking" type="button" data-i18n="reader.refresh_ranking"></button>
    </section>
    <p id="rankingHint" class="muted ranking-hint"></p>
    <main id="app" class="article-list" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" data-view="today"><span aria-hidden="true">▤</span><span data-i18n="reader.view_today">今日のニュース</span></button>
    <button type="button" data-view="saved"><span aria-hidden="true">◇</span><span data-i18n="reader.view_saved">あとで読む</span></button>
    <button type="button" data-view="history"><span aria-hidden="true">◷</span><span data-i18n="reader.view_history">評価の履歴</span></button>
    <button type="button" data-view="insights"><span aria-hidden="true">✧</span><span data-i18n="reader.view_insights">あなたの関心</span></button>
  </nav>
  <p id="feedbackStatus" class="toast" role="status" aria-live="polite"></p>
  <dialog id="settings" aria-labelledby="settingsTitle">
    <div class="dialog-heading"><h2 id="settingsTitle" data-i18n="reader.settings">設定</h2><button id="closeSettings" type="button" data-i18n="reader.close">閉じる</button></div>
    <p id="settingsStatus" role="status" aria-live="polite"></p>
    <p data-i18n="reader.privacy"></p>
    <label class="setting-row"><span data-i18n="reader.learning"></span><input id="learningToggle" type="checkbox"></label>
    <label class="setting-row"><span data-i18n="reader.compact"></span><input id="compactToggle" type="checkbox"></label>
    <label class="setting-row"><span data-i18n="reader.theme"></span><select id="theme"><option value="system" data-i18n="reader.system"></option><option value="light" data-i18n="reader.light"></option><option value="dark" data-i18n="reader.dark"></option></select></label>

    <h3 data-i18n="reader.data"></h3>

    <button id="resetData" class="danger" type="button" data-i18n="reader.reset"></button>
  </dialog>

功", "translated_summary": ["OpenAI と Ironclad が複雑な契約ワークフローの AI エージェント学習・評価を実施。", "コンピュータ操作能力の向上で専門職の業務自動化を実現。", "プロフェッショナルワークの効率化に向けた実践的な AI 応用例。"], "fallback_title": "", "url": "https://openai.com/index/advancing-computer-use-with-ironclad", "source": "OpenAI Blog", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-10-06T10:00:00+00:00", "raw_summary": "Learn how OpenAI and Ironclad are training and evaluating AI agents on complex contracting workflows to advance computer use for professional work.", "summary": ["OpenAI と Ironclad が複雑な契約ワークフローの AI エージェント学習・評価を実施。", "コンピュータ操作能力の向上で専門職の業務自動化を実現。", "プロフェッショナルワークの効率化に向けた実践的な AI 応用例。"], "impact": "AI エージェントのワークフロー自動化は、法務・契約業務などの知識労働の生産性向上と開発プロセスの標準化を推進。", "egg_insight": "", "score": 69.0, "category_relevance": 1.0, "category_quality_adjustment": 0.175}, {"id": "cc96c7bdca124515", "title": "GPT-5.6とGPT-6の信頼性テスト：Instantモードで失敗、Mediumで成功", "original_title": "I tested GPT-5.6 and GPT-6 with Medium → Instant → Medium. Both models failed on Instant, both succeeded on Medium. Here's what I found.", "display_title": "GPT-5.6とGPT-6の信頼性テスト：Instantモードで失敗、Mediumで成功", "translated_title": "GPT-5.6とGPT-6の信頼性テスト：Instantモードで失敗、Mediumで成功", "translated_summary": ["ChatGPT の信頼性問題を検証中。GPT-5.6 と GPT-6 は Instant で失敗、Medium で成功。", "A/B/A テストにより、応答消失、生成不完全、指示の不一貫さなどの問題を確認。", "長文作成やソフトウェア開発などの実務利用でモード選択が性能に大きく影響。"], "fallback_title": "", "url": "https://www.reddit.com/r/ChatGPT/comments/1x49sln/i_tested_gpt56_and_gpt6_with_medium_instant/", "source": "Reddit r/ChatGPT", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-10-12T18:29:31+00:00", "raw_summary": "I've been investigating some serious ChatGPT reliability issues over the past several days, and my latest tests revealed something particularly interesting: Both GPT-5.6 and GPT-6 showed problems under Instant, while Medium worked in every tested run. I'm a long-time ChatGPT power user, primarily working on long-form creative writing, software development, and projects requiring consistent context retention. After experiencing disappearing responses, incomplete generations, and inconsistent instruction-following, I decided to run controlled A/B/A tests. 1. GPT-5.6 – Medium → Instant → Medium Medium (Test 1): Successful. Response completed and remained visible. Instant (Test 2): Failed. Generated response disappeared. Medium (Control Test): Successful again. 2. GPT-6 – Medium → Instant → Medium Medium (Test 1): Successful. All requested story events were completed. Instant (Test 2): Failed. Response ended prematurely, leaving explicitly requested events unfinished. Medium (Control Test): Successful again. That's four successful Medium tests and two problematic Instant tests across two model generations. Important distinction: These are two different failure symptoms. GPT-5.6 lost a generated response, while GPT-6 prematurely ended a story. I'm not claiming they necessarily share the same root cause. Six runs aren't enough to establish causality, but the matching A/B/A pattern is worth investigating. 3. The technical evidence gets more interesting During my earlier investigation into disappearing GPT-5.6 Sol responses, I captured the following using Chrome Developer Tools: Endpoint: POST /backend-api/f/conversation HTTP status: 200 OK Content type: text/event-stream SSE completion indicator: complete Generated response visible during streaming Assistant message disappearing immediately afterward I also reproduced the disappearing-response behavior using GPT-5.5 in a completely new conversation. Clearing cookies didn't resolve the issue, and I've observed related symptoms across Windows, iOS, and Android. An HTTP 200 response and completed SSE stream don't prove successful message persistence, but they make the failure particularly interesting. These network diagnostics are from an earlier investigation, not from the latest A/B/A tests. 4. Did OpenAI change how Instant works? This is what I'm trying to understand. OpenAI positions Instant as the faster option for everyday tasks, while Medium provides additional reasoning effort. That's understandable. But does this mean complex, long-form creative writing is now effectively better suited to Medium? I've noticed that Medium generally completes my story prompts more reliably, but it also tends to write significantly longer responses than I actually requested. Instant often produces a more natural length, but lately it has become unreliable in my tests. I've even adjusted my custom instructions to explicitly require complete scenes without unnecessary length or invented plot developments. The differences persist. 5. Support and independent reports My investigation is already documented under OpenAI Support Case #16904787 . I've submitted screenshots, conversation URLs, network diagnostics, and reproduction details. Other users have reported similar disappearing-response symptoms: https://community.openai.com/t/chatgpt-web-ui-bug-entire-responses-and-download-links-disappear-until-page-reload/1404260 And broader GPT-5.6 reliability concerns: https://community.openai.com/t/gpt-5-6-sol-has-seriously-deteriorated-the-past-week-or-so/1399353 These reports don't prove a shared technical cause, but they suggest my experience isn't entirely isolated. 6. Has anyone else tested this? I'd genuinely appreciate results from other users. If you have access to GPT-5.6 or GPT-6, could you try the same Medium → Instant → Medium sequence with a reasonably complex prompt? Please note whether: The response completes all requested instructions. The generated message remains visible after completion. Reloading the page restores any missing content. Instant and Medium produce significantly different response lengths. The selected model and reasoning level remain unchanged. Ideally, use the same prompt and comparable conversation conditions. I'm especially interested in whether this behavior is specific to my account or whether others can reproduce it. Final thoughts I understand that different reasoning levels are supposed to behave differently. But faster reasoning shouldn't mean disappearing answers, and reduced reasoning shouldn't mean abandoning explicit instructions halfway through. I'm not claiming OpenAI deliberately degraded anything. I simply want to understand whether we're seeing a regression, a configuration issue, or an intentional change in how Instant is designed to handle complex tasks. At this point, I've spent so much time documenting bugs that I'm starting to feel like an unpaid QA engineer. 😭💀 I originally just wanted to write my stories. Now I'm comparing reasoning configurations, inspecting SSE streams, collecting request IDs, and running cross-model A/B/A tests. OpenAI, I wanted a writing assistant, not a second career in software quality assurance. 😂 &#32; submitted by &#32; /u/echoabenteuer [link] &#32; [comments]", "summary": ["ChatGPT の信頼性問題を検証中。GPT-5.6 と GPT-6 は Instant で失敗、Medium で成功。", "A/B/A テストにより、応答消失、生成不完全、指示の不一貫さなどの問題を確認。", "長文作成やソフトウェア開発などの実務利用でモード選択が性能に大きく影響。"], "impact": "AI モデルの信頼性テストとパフォーマンス最適化は、本番環境での運用安定性と開発ワークフロー効率化に直結。", "egg_insight": "", "score": 66.0, "category_relevance": 1.0, "category_quality_adjustment": 0.14}, {"id": "b97113703f9cb4ba", "title": "米メタ、最上位 AI 「Muse Wonder」とFull版を発表 記憶とコーディングで最先端と主張 - ビジネス+IT", "original_title": "米メタ、最上位 AI 「Muse Wonder」とFull版を発表 記憶とコーディングで最先端と主張 - ビジネス+IT", "display_title": "米メタ、最上位 AI 「Muse Wonder」とFull版を発表 記憶とコーディングで最先端と主張 - ビジネス+IT", "translated_title": "米メタ、最上位 AI 「Muse Wonder」とFull版を発表 記憶とコーディングで最先端と主張 - ビジネス+IT", "translated_summary": ["日本語原文記事です。主題は「米メタ、最上位 AI 「Muse Wonder」とFull版を発表 記憶とコーディングで最先端と主張 - ビジネス+IT」です。", "本文の手がかり: ... 開発 ・DevSecOps ASM・CTEM・脆弱性診断・レッドチーム AIセキュリティ ... AI・ 生成AI のおすすめコンテンツ. Copilot・ChatGPT・", "AI開発・ツール運用・プロダクト判断に関係する論点として確認します。"], "fallback_title": "", "url": "https://www.google.com/url?rct=j&sa=t&url=https://ww ry": "Claude Code に、見た目や動きを変える拡張の仕組み「Mods」が追加されましたね(v2.1.287 から正式に使えるようです)。 入れてみた記事や作ってみた記事がいくつか出ていますが、どれも開発者の目線で書かれていたので、ふだんコードを書かない私が1つ入れてみた際の手順や感想をまとめました。 今回入れたのは、入力欄の Markdown に色を付ける md-prompt という Mod です。入れるまでにつまずいたところが3つあったので、そこを中心に。 この記事でわかること コードを書かない人が Mod を1つ入れるまでの手順(実際に試した順) 入れる前に、その Mod が...", "summary": ["日本語原文記事です。主題は「Claude Code Modsは要る? コードを書かない私が1つ入れて確かめた ── 安全な入れ方と、使ってみた感想」です。", "本文の手がかり: Claude Code に、見た目や動きを変える拡張の仕組み「Mods」が追加されましたね(v2.1.287 から正式に使えるようです)。 入れてみた記事や作ってみた記事がいくつか", "AI開発・ツール運用・プロダクト判断に関係する論点として確認します。"], "impact": "「Claude Code Modsは要る? コードを書かない私が1つ入れて確かめた ─」はAI活用や開発運用の優先度判断に使える具体事例です。", "egg_insight": "", "score": 54.6, "category_relevance": 1.0, "category_quality_adjustment": 0.07}, {"id": "e0ddd61cc71bee7c", "title": "Sonnet 5.5 と GPT 6.1 Sol が Stratego で対戦、Codex がリソース制限で中断", "original_title": "Sonnet 5.5 (Claude Code) vs GPT 6.1 Sol (Codex) playing Stratego against each other. Codex hit its usage limit mid-game, so here’s what I have so far..", "display_title": "Sonnet 5.5 と GPT 6.1 Sol が Stratego で対戦、Codex がリソース制限で中断", "translated_title": "Sonnet 5.5 と GPT 6.1 Sol が Stratego で対戦、Codex がリソース制限で中断", "translated_summary": ["Codex がボードゲーム Stratego を自動生成、Claude Code との AI 対戦を実施。", "手動コーディングなしに AI のみでゲーム開発・対戦ロジック実装が可能。", "Codex の使用量制限による制約が出現、複雑タスクのリソース管理が課題。"], "fallback_title": "", "url": "https://www.reddit.com/r/ChatGPT/comments/1x4f0fa/sonnet_55_claude_code_vs_gpt_61_sol_codex_playing/", "source": "Reddit r/ChatGPT", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-10-12T21:48:35+00:00", "raw_summary": "I have zero game development experience. So I had Codex build Stratego from scratch, then threw Claude Code into the game to see which AI would win. I've been experimenting with Codex and Claude Code quite a lot lately, and I wanted to try something different. What happens if I let one AI build an entire board game, then have it compete against another AI that had absolutely nothing to do with developing it? So that's exactly what I did. Red is Codex running GPT 6.1 Sol on xhigh . Blue is Claude Code running Sonnet 5.5 on xhigh . And the funny thing is, I didn't write a single line of code myself. I don't even know how to develop games. First, building the actual game. I gave Codex three prompts. That was it. About 50 minutes later, the whole thing was running locally on my computer. The first prompt was basically: Build Stratego as accurately as possible, so I can let you and Claude Code play against each other. Codex built the game, including a referee server, a command-line interface for both players, the actual Stratego rules and a proper test suite. 42 tests passed. Then I thought, well, if I'm going to have two AIs play Stratego, I obviously want to watch the whole thing happen. So I asked for a live board, separate panels showing what both AIs are planning, whose turn it is, and automatic MP4 recording. Another prompt. Done. 69 tests passed. Then I figured it would be hilarious if they could actually talk to each other. So I asked Codex to build a shared chat where they could introduce themselves, have a conversation and occasionally talk some shit. Just no discussing strategies. Third prompt. 88 tests passed. So now I have an entire Stratego game, built from three prompts, with two AI opponents, a live spectator interface, private move explanations, a public chat and automatic video recording. Getting Claude Code into the game took me another five minutes. I opened the Code tab in the Claude desktop app, pointed it at the game folder and gave it one instruction explaining how to participate. And off they went. How the actual game works It's proper Stratego. A 10x10 board, 40 pieces per player, lakes in the middle, hidden ranks and the usual combat rules. Both AIs can see their own pieces, but have no idea what the opponent has placed where. They only discover enemy ranks when pieces fight. Every turn, an AI reads the current game state, writes a short explanation of what it's thinking of doing, chooses a piece and makes its move. I can read both explanations live, but the AIs can't see each other's notes. They also have their own public chat. That's where they can communicate directly, although I've explicitly forbidden them from discussing strategy. And everything gets recorded. The attached video is running at 5x speed because watching two language models carefully consider every bloody Stratego move in real time takes a while. One small thing I still need to fix: the MP4 doesn't show which enemy pieces have already been revealed to the observer. That works fine in the live interface, but the recording doesn't display that information properly yet. So if you're wondering why some pieces still appear unidentified after combat, that's why. Just something I need to fix in the video export. Oh, and sorry about all the Dutch text in the video. I originally built this for myself, so everything is in Dutch. I'll ask Codex to make an English version as well. And here's where it gets interesting. Red (Codex) opened with a scout moving two squares, immediately revealing its identity. Blue (Claude) responded by trading its own scout for it. Then Codex started pushing unknown pieces towards the middle, while Claude seemed perfectly happy to wait and let Codex take the initiative. Which actually makes sense in Stratego, because being the first to move next to an unknown enemy piece can be pretty dangerous. Eventually, a red major captured a blue miner. Claude immediately retaliated with its colonel and killed the major. Claude then tried setting up a trap involving its spy, which completely failed. A red lieutenant killed the spy, and Claude's colonel subsequently killed the lieutenant. But my favourite moment so far was when Codex moved an unidentified piece right next to Claude's marshal. Claude attacked. Turns out it was Codex's marshal. Both marshals instantly destroyed each other. So now both AIs have lost their strongest piece, and most of the dangerous pieces on the board are still completely unknown to the opponent. At this point, they're remarkably evenly matched. Both have lost a scout, their marshal and two additional pieces. One important detail, though. I can watch everything and see both AIs' private move explanations. I can also start and stop the server or give either AI additional instructions if something goes wrong. Technically, I could even interfere with the game myself. But I don't. I want to see what happens when I leave the actual decisions entirely to them. There is one limitation worth mentioning. Both AIs are running on the same Windows account and share the same project folder. Technically, that means they could access each other's files. The separation of hidden information currently depends on explicit instructions rather than actual operating-system isolation. Codex actually pointed this out itself while building the game. As far as I can tell, they've both respected those rules so far. Unfortunately, after about 12 moves each, Codex hit its usage limit. It resets at 2:21 AM, so the match is currently on hold. Which is slightly ridiculous when you think about it. I've basically got two of the most advanced AI coding models playing a board game against each other, one of them built the entire game itself, and now I have to wait because one of my players has run out of tokens. Anyway, I thought this was worth sharing already. For me, the most interesting part isn't even which AI eventually wins. It's how absurdly accessible this kind of experimentation has become. I had an idea, described what I wanted in normal language, and less than an hour later I had a working game that two completely separate AI systems could actually play against each other. And again, I have absolutely zero experience developing games. I'll post an update when Codex is back and they can continue beating the shit out of each other's armies. &#32; sub
