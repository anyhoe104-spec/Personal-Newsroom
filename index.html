ted with GPT-6 Astra. I gave it the reference and asked it to build an SVG with something resembling an artist's workflow. This was the instruction I started with: When drawing the SVG, try to imitate the workflow of a human artist: observe the reference, establish a rough sketch, refine it step by step, and revise it based on feedback from the current image. Decide what to draw next in batches, and adjust the proportions, contours, and connections during the process. Draw like a normal human artist. Astra's version had 1,619 drawable SVG elements. The result was already much closer to the reference than I expected, so I used that count as a requirement for the two Sol runs. They got the same reference, with the prompts adjusted to require 1,619 drawing elements too. Opus's finished file has 1,669 drawable elements. here's the comparison. The Image 2.5 reference is on top. Underneath, from left to right, are 5.6 Sol(max), 6 Sol(max), 6 Astra(max), and opus5.5(xhigh). Each panel follows the layer being drawn. The video replays the completed SVG files through an HTML player, with each replay fitted into 60 seconds. That's the playback duration, not the models' generation time. At the end, the reference moves to the left and the finished SVGs rotate on the right so you can compare each one more closely. 5.6 Sol's result is a mess. There's so much linework crossing the figure that the body and clothing get buried under it. You can make out a red robe and long black hair, but the face, the fabric, and the whole ink-wash feel are nowhere near the reference. I wouldn't accept that as a successful recreation. 6 Sol cleans up a lot of that mess. The figure is easier to read, and the hair and clothing look more organized. The improvement over 5.6 is obvious. But the face is still badly simplified, the robe is mostly broad, flat shapes, and the ink texture that made me choose this image is barely there. A cleaner outline doesn't get the painting back. That's why 6 Sol disappointed me so much. I had it on max, and this was still the result. I expected a lot more than a tidier failed attempt. I can see that it improved over 5.6 while still looking at the finished image and saying, no, this doesn't meet the brief. Both Sol outputs are below the bar for me. Astra is in a different league from the two Sols. The shading around the face and the folds give the figure and robe some weight. The fabric and background have all that broken, uneven texture I wanted from the reference. It gave me that &quot;wait, this is an SVG?&quot; reaction. Opus 5.5 on xhigh is right up there with Astra. It gets the face, the sweep of the hair, and the weight of the red fabric across, with enough softness and texture in the background for the whole thing to still feel like the reference. I'd be happy with either of these two recreations. Seeing Opus get there too makes 6 Sol's result even harder to excuse. I asked it to recreate this painting, and a cleaner version of 5.6's mess still doesn't do that. Watching Astra's replay was still what really got me. You can see the rough figure and large areas of color, then the smaller pieces accumulating around the hair, clothing, and background. The sketch-like beginning is built into the SVG itself. Even knowing how the replay works, watching those pieces turn into the finished image is ridiculously satisfying. This also brings me back to artists having to prove they drew something. A replay like this can show a rough sketch, layers of color, and a finished image taking shape. It still tells you very little about who made the file. Having your own process questioned feels like a pretty rough thing to deal with on top of everything else. GPT-6 Astra still gives me one of those early &quot;The Rock eating rocks&quot; moments. Watching those clips back then, would you have guessed how good video generation would get? Seeing this much of an ink painting reconstructed in SVG makes me curious about what we'll be looking at a few model generations from now. Give GPT more time... &#32; submitted by &#32; /u/Turbulent-Listen-393 [link] &#32; [comments]", "summary": ["GPT-5.6 Sol、GPT-6 Sol、GPT-6 Astra、Opus 5.5で中国墨絵スタイルのSVG画像生成を比較。", "AstraとOpusは90/100以上の評価で優秀だが、両Sol結果は60未満。", "ベクター図形を使用した墨のテクスチャ再現能力を検証する実験プロジェクト。"], "impact": "AI画像生成の品質向上とモデル選定基準を明確化し、クリエイティブワークフロー最適化に貢献。", "egg_insight": "", "score": 60.8, "category_relevance": 1.0, "category_quality_adjustment": 0.07}, {"id": "8205d45d33e59918", "title": "「LLMの出力コードを理解できない初心者ばかり」 PS5非公式ハックの主導者が離脱、 AI 時代の ...", "original_title": "「LLMの出力コードを理解できない初心者ばかり」 PS5非公式ハックの主導者が離脱、 AI 時代の ...", "display_title": "「LLMの出力コードを理解できない初心者ばかり」 PS5非公式ハックの主導者が離脱、 AI 時代の ...", "translated_title": "「LLMの出力コードを理解できない初心者ばかり」 PS5非公式ハックの主導者が離脱、 AI 時代の ...", "translated_summary": ["日本語原文記事です。主題は「「LLMの出力コードを理解できない初心者ばかり」 PS5非公式ハックの主導者が離脱、 AI 時代の ...」です。", "本文の手がかり: 背景には、LLMを使った 開発 や脆弱性研究を巡るコミュニティーへの強い懸念がある。AI時代のOSS 開発 ... 生成AI による組織変革の全貌 &middot; “第4世代AI", "AI開発・ツール運用・プロダクト判断に関係する論点として確認します。"], "fallback_title": "", "url": "https://www.google.com/url?rct=j&sa=t&url=https://atmarkit.itmedia.co.jp/ait/articles/2609/25/news048.html&ct=ga&cd=CAIyHGFkNTY4NGUzNjc1ZGMxMjY6Y28uanA6amE6SlA&usg=AOvVaw3agavlnf2wUBvT7dOjtMD9", "source": "Google Alert: 生成AI 開発", "source_type": "google_alert", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-09-25T23:40:37.534045+00:00", "raw_summary": "背景には、LLMを使った 開発 や脆弱性研究を巡るコミュニティーへの強い懸念がある。AI時代のOSS 開発 ... 生成AI による組織変革の全貌 &middot; “第4世代AI” 開発 の軌跡から&nbsp;...", "summary": ["日本語原文記事です。主題は「「LLMの出力コードを理解できない初心者ばかり」 PS5非公式ハックの主導者が離脱、 AI 時代の ...」です。", "本文の手がかり: 背景には、LLMを使った 開発 や脆弱性研究を巡るコミュニティーへの強い懸念がある。AI時代のOSS 開発 ... 生成AI による組織変革の全貌 &middot; “第4世代AI", "AI開発・ツール運用・プロダクト判断に関係する論点として確認します。"], "impact": "「「LLMの出力コードを理解できない初心者ばかり」 PS5非公式ハックの主導者が離脱、」はAI活用や開発運用の優先度判断に使える具体事例です。", "egg_insight": "", "score": 60.8, "category_relevance": 1.0, "category_quality_adjustment": 0.07}, {"id": "0c29a8acba3acfa0", "title": "プログラミング未経験者がChatGPTでゲーム開発に成功", "original_title": "Spent the last two months seeing how far a non programmer (me) can get building a proper game with nothing but ChatGPT in a browser.", "display_title": "プログラミング未経験者がChatGPTでゲーム開発に成功", "translated_title": "プログラミング未経験者がChatGPTでゲーム開発に成功", "translated_summary": ["ChatGPTをブラウザで使用し、2ヶ月かけてゲーム開発を実施。", "コーディング知識がない状態からAIツールが開発ジャーニーを大幅に加速。", "AIアシスタンスにより構造理解とロジック習得の課題を解決。"], "fallback_title": "", "url": "https://www.reddit.com/r/ChatGPT/comments/1wq9tbu/spent_the_last_two_months_seeing_how_far_a_non/", "source": "Reddit r/ChatGPT", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-09-25T23:40:37.435150+00:00", "raw_summary": "Gonna ironically preface this with: I haven't written the text below with an LLM. boxxy.io So I thought I'd show you what I've made over the last couple of months, because for me this has probably been one of the most rewarding uses of AI I've found. Please be kind, I spent a lot of time making this and writing the post here. More than anything, AI tools have helped me on my coding &quot;journey&quot;. It's something I've started and stopped for about thirty years and never really got to grips with properly. I've always understood how websites, software and apps are put together, and I've always been quite good at understanding the structure and logic of how something should work, but the actual coding side has always slowed me down. Level 15 of The Jigsaw level Pack on Boxxy.io It's called Boxxy and it's my version of Sokoban, the Japanese box pushing puzzle game. Sokoban has been around since the early 1980s and has become a bit of a cult game online. There are thousands of levels and lots of different versions of it, and making your own Sokoban clone almost feels like a rite of passage for any fans of the game. My goal was to learn how to do it, prove I could do it, and make something I was proud of. The whole thing has taken me roughly two months and cost me about £50, which is basically two months of ChatGPT Pro and the price of a domain. It was made solely with ChatGPT in a browser. I have not even touched Claude once. I don't have wee little AI bot workers doing things for me in the background. This was a series of requests, answers, outputs and iterations. Anyway, I started with the absolute bare bones of the game. Make a level appear, make a character move around it, make boxes move properly, work out when a level is finished. Once that was working I started adding level packs. Then aesthetics, then all the hidden stuff to keep it going and looking good and able to grow. Selecting a level from the Boxxy.io originals level pack of 50 The level design is completely manually done. All the original Boxxy levels and level packs I've made myself, without ChatGPT or generative AI. That has probably been some of the hardest work in the whole project because good Sokoban levels are surprisingly difficult to make. You can spend ages creating something, solve it a few times and then realise there's a stupid shortcut or that it just isn't very interesting. I've enjoyed that part enormously though. More recently I've been working on the less glamorous bits behind the scenes, like user accounts and server side stuff, which probably aren't very exciting to anybody playing it but was a big deal for me personally. A couple of months ago I wouldn't have really known where to begin with any of that. But now I have got a contact us page and even user logins! Something else I have kept making sure is that I don't have to rely on lots of outside servers or tools or plug ins. Almost everything is in house, apart from the Cloudflare connection which I need for the domain. This was so I won't have to go and fix things in the future when little plug ins and stuff fail. video game play walkthru of a few early levels I suppose this is where I don't quite know what to call the way I've made it. It obviously isn't traditional coding, because ChatGPT has written a huge amount of the actual code. But I don't think &quot;vibe coding&quot; quite covers it either, because I'm not just asking it to make things and accepting whatever it gives me. I've had to understand how the whole thing is structured, decide how I want it to work, test everything, find problems, reject bad solutions and sometimes tell it that the entire approach is wrong and needs doing again. I'm constantly using the phrase &quot;do not patch this, we need to fix it from the base level&quot; to avoid messy coding I've even delved into the code a few times myself to adjust things by hand! Go me! A very good programmer friend of mine described what is happening now in a way that really stuck with me. He said that English is effectively becoming another programming language. He's a vastly better coder than most and even he said he barely writes code by hand any more because AI is doing so much of that part of the job for him. (He uses Claude btw) Linus Torvalds (Linux) has made a similar point recently too by comparing AI tools to compilers. Compilers didn't stop people being programmers, they just meant programmers no longer needed to write everything in 0s and 1s. My coding pal also said something pretty salient. In the 1980s games were often made by one person or a tiny team. Over the years everything became much bigger, more expensive and whatnot. Because of AI and coding it's started swinging back in the other direction now with tiny indie teams making games. I reckon that's pretty poetic. Reminds me of Halt &amp; Catch Fire and their Mutiny startup! I suppose this is where I don't quite know what to call the way I've made it. It obviously isn't traditional coding, because ChatGPT has written a huge amount of the actual code. But I don't think &quot;vibe coding&quot; quite covers it either, because I'm not just asking it to make things and accepting whatever it gives me. I've had to understand how the whole thing is structured, decide how I want it to work, test everything, find problems, reject bad solutions and sometimes tell it that the entire approach is wrong and needs doing again. Anyway, Boxxy has very much been a labour of love. There isn't a client and I didn't start it because I thought it would make me money. I've just really enjoyed making it, which is probably why I've kept disappearing down increasingly unnecessary rabbit holes with it. After about thirty years of occasionally thinking &quot;I'd love to be able to make that&quot;, I finally can, and that's been quite a nice feeling. Made sure it works well on phones, tablets and large screens. Lots of ways to interact. Anyway, above are some screenshots and a bit of gameplay. If you fancy having a look at the game itself, I'm sure you'll be able to find it online. Some rough facts and figures: - Built with ChatGPT 5.6 on high in a browser. Had to start several dozen chats which was laborious as you had to get each new chat to relearn. - Is currently about 25mb in size, has around 30,000 lines of code, is written in Javascript, CSS and HTML , is currently on v282 (around 300 iterations in total) - Took about 2 months to get to this point, working on it several hours a day sometimes. - I have built 4 level packs by hand which total 113 new levels + around 100 more which haven't been released yet. - My children say the character &quot;looks AI&quot; so I have commissioned them both with making new sprites for me! We'll see how that turns out. - Cost in total, including the OpenAI subscription, about £50 - Works on a browser, works on a mobile, works on an iPad - Is not making any money. There's zero ads and zero sign up. - Most recent things I've built are a contact us page (which didn't require buying a mailserver, yay) and a user login to save progress. - What I'd like to do most at the moment is make it into an app that can be launched on Apple TV. - The backend of Boxxy is gigantic. I've also built my own level maker, level pack builder, solver and whatnot. - It has a tonne of easter eggs which I've always loved! &#32; submitted by &#32; /u/samcornwell [link] &#32; [comments]", "summary": ["ChatGPTをブラウザで使用し、2ヶ月かけてゲーム開発を実施。", "コーディング知識がない状態からAIツールが開発ジャーニーを大幅に加速。", "AIアシスタンスにより構造理解とロジック習得の課題を解決。"], "impact": "LLMによる開発民主化で、非技術者の生産性向上とAI活用の新たなユースケース創出。", "egg_insight": "", "score": 57.5, "category_relevance": 1.0, "category_quality_adjustment": -0.02}, {"id": "fc4e7c19b702b45d", "title": "【Jev vs GPT】比較検証するとAPI費用は1/148、判断時間は1/14になった", "original_title": "【Jev vs GPT】比較検証するとAPI費用は1/148、判断時間は1/14になった", "display_title": "【Jev vs GPT】比較検証するとAPI費用は1/148、判断時間は1/14になった", "translated_title": "【Jev vs GPT】比較検証するとAPI費用は1/148、判断時間は1/14になった", "translated_summary": ["日本語原文記事です。主題は「【Jev vs GPT】比較検証するとAPI費用は1/148、判断時間は1/14になった」です。", "本文の手がかり: はじめに LLMに頼む仕事の中には、文章やコードを作ってほしいわけではなく、「この中から適切なものを一つ選んでほしい」だけの処理があります。 そこで最近話題の判断に特化したモデルJ", "AI開発・ツール運用・プロダクト判断に関係する論点として確認します。"], "fallback_title": "", "url": "https://zenn.dev/yukurash/articles/8c286e586afa44", "source": "Zenn LLM", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-09-25T09:42:27+00:00", "raw_summary": "はじめに LLMに頼む仕事の中には、文章やコードを作ってほしいわけではなく、「この中から適切なものを一つ選んでほしい」だけの処理があります。 そこで最近話題の判断に特化したモデルJevです。 いつものLLMが担う「選ぶ仕事」をJevに移したら、精度・待ち時間・費用はどう変わるのか？ そこを検証してみました。 題材に選んだのは、ボタン名の変更で落ちるPlaywrightテストです。 正しい操作先を選び直すには言葉の意味を理解する必要がありますが、テスト全体を書き直してもらう必要はありません。 この判断役をGPT-5.5・Jev・ルールで差し替え、比較し、Jev の有用性を検証してみまし...", "summary": ["日本語原文記事です。主題は「【Jev vs GPT】比較検証するとAPI費用は1/148、判断時間は1/14になった」です。", "本文の手がかり: はじめに LLMに頼む仕事の中には、文章やコードを作ってほしいわけではなく、「この中から適切なものを一つ選んでほしい」だけの処理があります。 そこで最近話題の判断に特化したモデルJ", "AI開発・ツール運用・プロダクト判断に関係する論点として確認します。"], "impact": "「【Jev vs GPT】比較検証するとAPI費用は1/148、判断時間は1/14にな」はAI活用や開発運用の優先度判断に使える具体事例です。", "egg_insight": "", "score": 55.6, "category_relevance": 1.0, "category_quality_adjustment": 0.105}, {"id": "1fa7415bfadfdb24", "title": "AI（Aion）に小説を書かせたら「小説家」ではなく「制作スタジオ」になった話
