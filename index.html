    <main id="app" class="article-list" tabindex="-1"></main>

{"id": "26aa4d763b49b1b2", "title": "Ampはコードを超えたAIエージェントをOpenAIモデルで活用", "original_title": "Amp puts AI agents to work beyond code with OpenAI models", "display_title": "Ampはコードを超えたAIエージェントをOpenAIモデルで活用", "translated_title": "Ampはコードを超えたAIエージェントをOpenAIモデルで活用", "translated_summary": ["Ampは GPT-6 Astra、Ultrafast、GPT-Live-1を活用し、AIエージェント機能の可能性を拡大。", "Chat GPT連携で新たなサインイン方式を実装し、ユーザー体験を強化。", "エージェント技術がコード開発以外の領域での応用を実現する新展開。"], "fallback_title": "", "url": "https://openai.com/index/amp-beyond-coding", "source": "OpenAI Blog", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-10-14T12:00:00+00:00", "raw_summary": "See how Amp pushes the frontier of what agents can do with GPT-6 Astra, Ultrafast, GPT-Live-1, and Sign in with ChatGPT.", "summary": ["Ampは GPT-6 Astra、Ultrafast、GPT-Live-1を活用し、AIエージェント機能の可能性を拡大。", "Chat GPT連携で新たなサインイン方式を実装し、ユーザー体験を強化。", "エージェント技術がコード開発以外の領域での応用を実現する新展開。"], "impact": "コード自動化以外のワークフロー領域でAIエージェント活用を広げ、開発者の生産性向上に寄与。", "egg_insight": "", "score": 68.5, "category_relevance": 1.0, "category_quality_adjustment": 0.175}, {"id": "408db63d3f3a5123", "title": "Claudeを使用してOblivion Remasteredのパフォーマンスを改善", "original_title": "Used Claude to fix Oblivion Remastered performance", "display_title": "Claudeを使用してOblivion Remasteredのパフォーマンスを改善", "translated_title": "Claudeを使用してOblivion Remasteredのパフォーマンスを改善", "translated_summary": ["Claude AIを活用し、ゲーム最適化の問題診断と解決策立案を実施。", "トークン効率的なデバッグで、既存GPUハードウェアでもゲーム動作の改善を実現。", "開発者が最新AIモデルを実用的なトラブルシューティングに活用する事例。"], "fallback_title": "", "url": "https://www.reddit.com/r/ChatGPT/comments/1x8jpd5/used_claude_to_fix_oblivion_remastered_performance/", "source": "Reddit r/ChatGPT", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-10-17T20:00:40+00:00", "raw_summary": "I've been playing Oblivion since 2006 and was naturally very excited when the Remastered version got shadow-dropped last year. Imagine my disappointment when even after upgrading from 2070 Super to 9070 XT the game continued to run poorly, with low fps and stuttering on my 5800X CPU and 32GB DDR4 RAM. From various user reports and the fact that even at a low resolution and graphic settings the game was still laggy (e.g. 20-30 FPS in Cheydinhal) it was clear that the problem is in poor optimization. But it was not clear what to do about this, that is, until I've got Claude subscription a few weeks ago. On the last day before weekly reset of my $20 plan I've had some tokens to burn and decided for fun to launch the game, alt-tab to Claude and ask Opus 5.5 how come the fps is so low. Imagine my shock as it was able to somehow (no reverse-engineering software installed, just asked me to link my GitHub account to Epic organization for access to UE source codes) analyze what's going on and find a few huge inefficiencies. Apparently, the game was reconstructing the whole lighting of a scene in each frame even when nothing was changing, which was obviously a huge strain on CPU that had to parse all this work on a single thread (!). What followed was an immediate upgrade to the Max x5 plan (btw that gave me an immediate full reset) and two weeks of intense work where we've: Built a benchmark harness so Claude can optimize bottleneck scenarios autonomously while I'm at work, including completely silent and headless mode in case I work from home PC Found ~40 improvements that brought in-city FPS from ~30 to stable 60, open-world average FPS improvement by ~30-40%, and made traversal stutter almost unnoticeable Provided full-support for latest AMD FSR FrameGen, including setting optimizations to avoid stutters and game sending camera information required for full functionality Fixed several bugs in the original game and Remastered code Shared the work on GitHub in a clear, reproducible way Recorded a few demonstration videos to show improvements, Claude was in charge of routing, camera work, music selection and timings. Work pattern was as follows: Find an in-game place / scenario where I observe poor performance / stuttering. Ask Claude to build a benchmark out of it for independent optimization. Early in the day set /goal to orchestrate work on fixing the identified scenario performance. Limiting it to 2 Opus 5.5 sub-agents was usually enough to not run into 5 hour limit. Computer keeps running at home and I can check progress and steer via mobile app. In the evening review work, test, provide feedback. Usually the topic was resolved, I kept playing until finding a new scenario where performance was bad. After roughly 2.5 weeks of Max x5 allowance we were able to reach the result you see on the video. Amazing, for someone who is not even an IT developer, to be able to do something that a multi-billion corporation didn't manage in ~1.5 years since the release. And I think even the most AI-skeptical people find it hard to object when AI is used to make existing well-beloved games perform better and have fewer bugs. Hoping this inspires a wave of AI-fueled bug fixes and optimizations! If you are curious to review work or try yourself, would be happy to hear your thoughts: https://github.com/LTSharpe/OblivionRemasteredPerformanceFix &#32; submitted by &#32; /u/LTSharpe [link] &#32; [comments]", "summary": ["Claude AIを活用し、ゲーム最適化の問題診断と解決策立案を実施。", "トークン効率的なデバッグで、既存GPUハードウェアでもゲーム動作の改善を実現。", "開発者が最新AIモデルを実用的なトラブルシューティングに活用する事例。"], "impact": "AIモデルによるパフォーマンス診断が、開発工程の効率化と課題解決の加速を促進。", "egg_insight": "", "score": 60.8, "category_relevance": 1.0, "category_quality_adjustment": 0.105}, {"id": "ad5a1386b67cbd94", "title": "医療機関の機密情報を守りながら 生成AI を活用する。Incerto - 調布経済新聞", "original_title": "医療機関の機密情報を守りながら 生成AI を活用する。Incerto - 調布経済新聞", "display_title": "医療機関の機密情報を守りながら 生成AI を活用する。Incerto - 調布経済新聞", "translated_title": "医療機関の機密情報を守りながら 生成AI を活用する。Incerto - 調布経済新聞", "translated_summary": ["日本語原文記事です。主題は「医療機関の機密情報を守りながら 生成AI を活用する。Incerto - 調布経済新聞」です。", "本文の手がかり: ... LLMを動かし、セキュリティ対策と 生成AI ... 開発
