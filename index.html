<html lang="ja">

      <h1 data-i18n="header.headline">今日の視点を、育てる。</h1>

      <button id="refreshRanking" type="button" data-i18n="reader.refresh_ranking"></button>
    </section>
    <p id="rankingHint" class="muted ranking-hint"></p>
    <main id="app" class="article-list" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" data-view="today"><span aria-hidden="true">▤</span><span data-i18n="reader.view_today">今日のニュース</span></button>

  <p id="feedbackStatus" class="toast" role="status" aria-live="polite"></p>

view.redd.it/5jtt7a1sfy0i1.jpeg?width=1920&amp;format=pjpg&amp;auto=webp&amp;s=03f138ccaa906b22bc3e03bec158401a12859354 i designed it and used ai to write most of the code. one thing i learned fast is the ai doesnt care about size at all. if you let it, everything slowly gets heavier. so here's what i did: tested instead of guessing. the ai can write two versions of something fast, but it cant tell you which one is lighter. i had the home page built both ways and measured. one was about 3x lighter, so that's the one that shipped checks that fail if it gets heavy. the tests fail if the app uses more than 250 MB of memory sitting idle. the ai kept creeping past that until the check was there, now it sits around 70 launch night was the best part. people jumped into discord and tested it hard, some even sent the exact file and line to fix. i had 3 updates out within 4 hours, and it's at 18 updates and 5,000+ docker pulls since https://preview.redd.it/y4frnkgtfy0i1.jpeg?width=1920&amp;format=pjpg&amp;auto=webp&amp;s=c863d6fba85f094c387e5a88c9e915232a43af00 my workflow is simple. i design it and write the spec, ai writes most of the code, a second agent reviews it, and then i review it myself and test it on my own server. i've been in security for 10+ years, so anything touching keys, sign-in or the network gets read line by line, and it got a full pentest before launch later on the roadmap, not started yet: letting chatgpt and other ai apps talk to your library, so you can ask &quot;what should we watch tonight&quot; and have it request it for you it's called HolyArrs and it's free. it's still a beta with bugs i want to fix, so don't make it your main app yet. if you try it, i'd love to hear what breaks. i'm in the comments and happy to go deep on the workflow if you build with ai too, whats the one rule that keeps your project from getting heavier and messier? GitHub Docker Hub HolyArrs.com Docs &#32; submitted by &#32; /u/CoderLuii [link] &#32; [comments]", "summary":
