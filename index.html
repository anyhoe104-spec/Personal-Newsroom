<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body>
  <a class="skip-link" href="#app">記事一覧へ</a>
  <header class="app-header">

    <button id="openSettings" class="settings-button" type="button" data-i18n="reader.settings">設定</button>

      <h1 data-i18n="header.headline">今日の視点を、育てる。</h1>
      <p class="intro" data-i18n="reader.intro">読む。選ぶ。自分の視点が育つ。</p>

      <label class="check-label"><input id="unread" type="checkbox"><span data-i18n="reader.unread">未読のみ</span></label>
      <button id="refreshRanking" type="button" data-i18n="reader.refresh_ranking"></button>
    </section>
    <p id="rankingHint" class="muted ranking-hint"></p>
    <main id="app" class="article-list" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" data-view="today"><span aria-hidden="true">▤</span><span data-i18n="reader.view_today">今日のニュース</span></button>
    <button type="button" data-view="saved"><span aria-hidden="true">◇</span><span data-i18n="reader.view_saved">あとで読む</span></button>
    <button type="button" data-view="history"><span aria-hidden="true">◷</span><span data-i18n="reader.view_history">評価の履歴</span></button>
    <button type="button" data-view="insights"><span aria-hidden="true">✧</span><span data-i18n="reader.view_insights">あなたの関心</span></button>
  </nav>
  <p id="feedbackStatus" class="toast" role="status" aria-live="polite"></p>

    <button id="resetData" class="danger" type="button" data-i18n="reader.reset"></button>

規模 AI サービスの安定運用に不可欠なインフラ技術が実証、企業運用負荷大幅削減可能。", "egg_insight": "", "score": 67.0, "category_relevance": 1.0, "category_quality_adjustment": 0.105}, {"id": "b596bc7445d18e2d", "title": "Getting through the app review process & how we did it for our job search plugin.", "original_title": "Getting through the app review process & how we did it for our job search plugin.", "display_title": "Getting through the app review process & how we did it for our job search plugin.", "translated_title": "", "translated_summary": [], "fallback_title": "要確認: Getting through the app review process & how we did it for our job search plugin.", "url": "https://www.reddit.com/r/ChatGPT/comments/1xdmf1s/getting_through_the_app_review_process_how_we_did/", "source": "Reddit r/ChatGPT", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-10-23T18:44:15+00:00", "raw_summary": "Total review time: About 2 weeks Back and forth with OpenAI: 2 times We built Dreamwork, a job search plugin in the ChatGPT directory. Here are a few things that might be useful for you as you submit: 1. Have your agent read the plugin rule line by line. This week a minor update got 23 of our 69 tools blocked. To be fair, the fules exist to protect us from sketchy plugins so I'm not mad, but a few rules are stricter than you'd think. Watch out for the &quot;Destructive” flag, which applies to any action the user can't cleanly take back. Every tool in a ChatGPT plugin has to declare three things: whether it only reads, whether it reaches the open web, and whether it’s destructive. OpenAI counts deleting, overwriting, cancelling, revoking access, and any send or transaction that can’t be reversed. Only a purely additive write, one that creates something new and changes nothing else, gets to say no. Having an undo button doesn’t change the answer. Examples for us: Rewriting your cover letter is destructive, even though there’s an undo. Hiding a job you don’t want is destructive. Even saving a job is, because saving can start writing your materials in the background, and that uses part of your daily allowance. Submitting an application is the most destructive thing we do; it goes to a real employer under your name, and once it’s sent it’s sent. ChatGPT reads those labels before it calls a tool, and OpenAI requires a human yes before anything irreversible. So when you tell our agent to apply, the first call sends nothing. It comes back with a summary of what’s about to go out, and the application only leaves after you confirm. Replying to a recruiter works the same way. 2. No selling. A plugin can sell physical goods. It can’t sell subscriptions, credits or digital content, show you plans, or link you to checkout . This is different from Claude! It can tell you a feature isn’t on your plan, and that’s about it. We took checkout out of the ChatGPT version entirely, so it's all free messaging. The hard part was our error messages - encouraging upgrade to pro was sitting in refusals we never thought of as copy. In ChatGPT every one of those now says the same thing: your plan doesn’t include this or you’ve hit its limit, nothing was purchased, and nothing changed. The flip side is that a plugin can’t give ChatGPT users a worse version than its own site, or charge them more. Our ChatGPT version has every tool the Claude one has except checkout. 3. There's less data in both directions. Plugins can’t ask for your passwords, SSN, card numbers or health information (we don't want any of this, to be clear). Tools can’t request your whole chat history, only what the task needs. Our preferences tool takes the one sentence you said (“remote only, no crypto”) and not the conversation around it. Responses get trimmed too; ours strip internal IDs, contact details and screening answers before anything goes back to ChatGPT. 4. Approval isn’t a one-time thing. OpenAI rescans every update. Ours had 23 tools that we changed from destructive to not during a cleanup on our side. They actually paused our connector after the next daily scan. We eventually flipped them back and everything was live again the same day. Hopefully this is helpful to anyone else building a connector! &#32; submitted by &#32; /u/Cojj25 [link] &#32; [comments]", "summary": ["原題は「Getting through the app review process & how we did it for our job search plugin.」。Claude翻訳結果が不十分だったため個別確認対象です。", "本文の手がかり: Total review time: About 2 weeks Back and forth with OpenAI: 2 times We built Dreamwork, a...", "正式な日本語要約は記事本文を確認して差し替える必要があります。"], "impact": "「Getting through the app review process」はAI開発ワークフローや製品判断への影響確認が必要です。", "egg_insight": "", "score": 65.4, "category_relevance": 1.0, "category_quality_adjustment": 0.07}, {"id": "af5c7eaad5e5a188", "title": "複数行の指示が2行目以降消えた。Claude Code・CodexとWindowsで踏んだ10の罠", "original_title": "複数行の指示が2行目以降消えた。Claude Code・CodexとWindowsで踏んだ10の罠", "display_title": "複数行の指示が2行目以降消えた。Claude Code・CodexとWindowsで踏んだ10の罠", "translated_title": "複数行の指示が2行目以降消えた。Claude Code・CodexとWindowsで踏んだ10の罠", "translated_summary": ["日本語原文記事です。主題は「複数行の指示が2行目以降消えた。Claude Code・CodexとWindowsで踏んだ10の罠」です。", "本文の手がかり: AI に Windows 用のスクリプトを書かせると、コードは正しそうなのに、エラーも出さずに動かないことがあります。改行の入った依頼が最初の1行で切れる、日本語の入ったスクリプト", "AI開発・ツール運用・プロダクト判断に関係する論点として確認します。"], "fallback_title": "", "url": "https://zenn.dev/twinharness/articles/windows-traps-ai-scripts", "source": "Zenn AI", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-10-23T14:36:23+00:00", "raw_summary": "AI に Windows 用のスクリプトを書かせると、コードは正しそうなのに、エラーも出さずに動かないことがあります。改行の入った依頼が最初の1行で切れる、日本語の入ったスクリプトが文字化けして構文エラーになる、タスクが登録した日にしか動かない、といった具合です。 私は、AI の開発支援ツール（Anthropic の Claude Code と OpenAI の Codex）の共通ルールとスクリプトを agent-toolkit というリポジトリ（ファイルと変更履歴をまとめて置く場所）に集めていて、その中に「この PC で実際に踏んだ罠」の記録（WINDOWS_TRAPS.md）を作って...", "summary": ["日本語原文記事です。主題は「複数行の指示が2行目以降消えた。Claude Code・CodexとWindowsで踏んだ10の罠」です。", "本文の手がかり: AI に Windows 用のスクリプトを書かせると、コードは正しそうなのに、エラーも出
