      <button id="refreshRanking" type="button" data-i18n="reader.refresh_ranking"></button>
    </section>
    <p id="rankingHint" class="muted ranking-hint"></p>
    <main id="app" class="article-list" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" data-view="today"><span aria-hidden="true">▤</span><span data-i18n="reader.view_today">今日のニュース</span></button>

    <p><a id="policyLink" href="./policy.html" data-i18n="reader.policy_link"></a></p>

    <h3 data-i18n="reader.data"></h3>
    <div class="data-actions"><button id="downloadBackup" type="button" data-i18n="reader.backup"></button><label class="import-label"><span data-i18n="reader.import"></span><input id="importBackup" type="file" aria-describedby="importHelp"></label><p id="importHelp" data-i18n="reader.import_help"></p></div>

", "url": "https://www.reddit.com/r/ChatGPT/comments/1xwcffw/gpt_image_26_still_struggles_with_character/", "source": "Reddit r/ChatGPT", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-11-14T20:27:52+00:00", "raw_summary": "GPT's image generation feels pretty inconsistent overall. This is especially obvious with realistic people—even when I feed it a reference image, it constantly spits out a completely different person. Even if I get lucky and it generates someone close to the ref, the moment I try a different pose or scene, they immediately turn into someone else again. To fix this, I've changed up my reference workflow multiple times and even had GPT help me tweak the prompts over and over, but nothing worked. It also still struggles with finer details, like mangled fingers or warped clothes and shoes. I'm glad the 2.6 update finally fixed that weird graininess, but it's still disappointing that it insists on making everyone look overly beautified. On the flip side, strictly for realistic images, Gemini doesn't over-beautify faces—it looks super authentic and does a great job faithfully recreating the reference image. Even when I change the scene or pose multiple times, it at least keeps the person consistent, and issues like distorted hands or outfits are kept well in check. Personally, I'm leaning toward these limitations being a side effect of strict guardrails, but what do you guys think? &#32; submitted by &#32; /u/IntroductionMother48 [link] &#32; [comments]", "summary": ["リファレンス画像を指定してもGPT Image 2.6は人物の一貫性を保てず、ポーズや背景が変わると別人に変わる", "指の歪みや衣服・靴の形状の細部表現が依然として改善不足で、品質にばらつきがある", "複数回のプロンプト調整やワークフロー変更を試みたが、キャラクター一貫性の根本的解決には至らない"], "impact": "画像生成タスクの信頼性に影響し、AIワークフロー最適化やプロンプト設計の課題を浮き彫りにする", "egg_insight": "", "score": 65.5, "category_relevance": 1.0, "category_quality_adjustment": 0.07}, {"id": "2824a291d23ba1cc", "title": "スリーパーエージェントを自作して、差分からバックドアを探してみた", "original_title": "スリーパーエージェントを自作して、差分か
