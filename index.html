<html lang="ja">

<body>

    <section class="hero">

      <h1 data-i18n="header.headline">今日の視点を、育てる。</h1>

      <button id="refreshRanking" type="button" data-i18n="reader.refresh_ranking"></button>
    </section>
    <p id="rankingHint" class="muted ranking-hint"></p>
    <main id="app" class="article-list" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" data-view="today"><span aria-hidden="true">▤</span><span data-i18n="reader.view_today">今日のニュース</span></button>

    <p><a id="policyLink" href="./policy.html" data-i18n="reader.policy_link"></a></p>

障害と緊急対応の不足", "translated_summary": ["ChatGPT WorkとCodexに依存するビジネスが1週間の深刻なシステム障害に直面", "Goal機能の起動失敗とエージェントの無限ループが業務に多大な悪影響", "OpenAIのビジネスサポート体制が不十分で企業依存度とのギャップが顕在化"], "fallback_title": "", "url": "https://www.reddit.com/r/ChatGPT/comments/1xor9x3/both_my_paid_chatgpt_business_accounts_are/", "source": "Reddit r/ChatGPT", "source_type": "rss", "source_region": "jp", "category": "ai_dev", "category_label": "AI・活用", "published_at": "2026-11-05T19:06:21+00:00", "raw_summary": "I run a business that relies heavily on ChatGPT Work and Codex. I've invested an enormous amount of time building workflows around these products, largely because OpenAI has positioned them as tools businesses can rely on. For roughly a week, the experience has been an absolute nightmare. I've had repeated problems with /goal failing to initiate, agents getting stuck in loops, tasks supposedly continuing autonomously when they've actually stopped, and conversations spending more time troubleshooting themselves than accomplishing anything. Meanwhile, my usage has been disappearing at an absolutely staggering rate. At one point, 85.9% of my weekly allowance was categorized as &quot;Unknown.&quot; Another usage report showed more than half of the consumption attributed to Goal continuations! Some of that consumption could be legitimate. Fast mode is expensive, and I understand that. But when the service repeatedly malfunctions, continues running things you can't properly track, and burns through your allowances without delivering the work, something is seriously wrong. Now BOTH paid ChatGPT Business seats in my workspace have hit 0% weekly usage remaining. I literally cannot continue the work I've been relying on this service to perform. And here's the part that really gets me: There appears to be no meaningful emergency escalation process for ordinary ChatGPT Business customers. No human staffed emergency phone line. No guaranteed immediate access to someone empowered to restore service. Just support tickets, AI generated replies, and eventually an email saying your case has been escalated and someone might respond &quot;in the coming days.&quot; In the meantime, I'm losing productive work hours and money. I've submitted detailed support reports, screen recordings, error messages, and documentation across multiple cases. I've asked for a technical investigation and temporary restoration of access. So far, no actual resolution. I even have unused reset entitlements, but why should I have to sacrifice those to compensate for a service that may just consume the restored allowance through the same malfunctioning workflows? If OpenAI wants businesses to build their operations around these products, it needs business appropriate support when those products fail. You cannot market autonomous AI agents as indispensable business infrastructure and then leave paying customers stranded with no meaningful emergency response. I'm posting this because I doubt I'm the only person experiencing it. If you've encountered unexplained usage depletion, malfunctioning Goals, endless agent loops, or support that goes nowhere, please document it and submit a formal support ticket. Ask for a human review, a detailed accounting of your usage, and restoration or compensation where appropriate. And please share your experience here. Did OpenAI actually fix the issue? Restore your usage? Offer credits or refunds? How long did it take to reach someone who could meaningfully help? I want these products to succeed. I've invested too much in them not to. But businesses cannot reasonably be expected to accept this level of disruption without an effective way to get help. &#32; submitted by &#32; /u/ZaidibnAli [link] &#32; [comments]", "summary": ["ChatGPT WorkとCodexに依存するビジネスが1週間の深刻なシステム障害に直面", "Goal機能の起動失敗とエージェントの無限ループが業務に多大な悪影響", "OpenAIのビジネスサポート体制が不十分で企業依存度とのギャップが顕在化"], "impact": "エンタープライズ向けAIツールの信頼性課題が浮上し、ビジネス向けワークフロー自動化の安定性が問題化", "egg_insight": "", "score": 63.1, "category_relevance": 1.0, "c
