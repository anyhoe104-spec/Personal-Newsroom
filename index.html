<html lang="ja">

      <button id="refreshRanking" type="button" data-i18n="reader.refresh_ranking"></button>
    </section>
    <p id="rankingHint" class="muted ranking-hint"></p>
    <main id="app" class="article-list" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" data-view="today"><span aria-hidden="true">▤</span><span data-i18n="reader.view_today">今日のニュース</span></button>

  <p id="feedbackStatus" class="toast" role="status" aria-live="polite"></p>

buntu Linux running the NVIDIA Grace Blackwell Chip and 128gb unified memory with only a passing knowledge of Linux and knowing nothing about the NVIDIA hardware and software. Buying the box was an expensive gamble and it could have become an expensive paperweight if I didn't have ChatGPT. ChatGPT has been a patient tutor from the beginning, walking me through concepts and teaching me by example to start from zero to running and optimizing multiple models, running through benchmarking, running agents, suggesting solid Github repos to use for various tasks, writing a syllabus of what I want to learn, and getting me to the point where I am designing a secure container and MicroVM to run AI agents with an extra layer of security that I understand because I'm building it to my specification and ChatGPT is the tutor and pair-programmer. It's adapted to my preferred learning style and it remembers details from months ago that avoid me screwing things up and patiently explaining new concepts that arise as I do this work. I've been at this since late June 2026 and it's been hard work because I'm not just vibe coding but going through things step-by-step, reading the shell scripts and code along the way and asking a lot of questions. Most days I'm putting in at least 8 hours. I feel like I'm getting a graduate-level course in AI with a specialization in security for the $3500 I paid for the machine and a $20/month subscription. Yeah - some days it seems dumber than others but I'd say 95% of the time it gets things right on the first shot - and it can be proven because we then test things and adjust if things don't work as expected. I was looking at online courses in AI that cost as much as the computer in the spring - and those courses would be obsolete by now as the landscape has changed so much in 6 months. This has been a much better investment. &#32; submitted by &#32; /u/AnnoyedAvocado21 [link] &#32; [comments]", "summary": ["複雑な NVIDIA ハードウェアと Linux 環境の学習で ChatGPT が継続的
