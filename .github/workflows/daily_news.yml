name: Daily Personal Newsroom

# Production moved to the private newsroom-themes repository, which builds the
# site and pushes it to this repository's gh-pages branch; GitHub Pages serves
# that branch. This workflow no longer runs on a schedule or publishes anything.
# It stays as a manual end-to-end check of the engine.
# See docs/migration-handoff.md (Gate 2).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Console level for every pipeline step. Set DEBUG on a manual run to get the
      # per-article translation diagnostics back.
      NEWSROOM_LOG_LEVEL: INFO
      # The runner is discarded after the run and GitHub keeps the console log,
      # so the rotating file is only useful for local runs.
      NEWSROOM_LOG_FILE: ""
      # The personal pack is private now; check the engine against the sample
      # pack. .state/ is gitignored. (runner.* is not available in job-level env.)
      NEWSROOM_CONFIG_DIR: ${{ github.workspace }}/themes/example
      NEWSROOM_STATE_DIR: ${{ github.workspace }}/.state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Update derived RSS tags
        run: python scripts/update_preferences.py

      - name: Fetch RSS
        run: python scripts/fetch_rss.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Score articles
        run: python scripts/score_articles.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Validate newsroom output
        run: python scripts/validate_newsroom.py
