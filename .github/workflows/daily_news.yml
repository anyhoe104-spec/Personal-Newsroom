name: Daily Personal Newsroom

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Each run starts from a clean checkout, so the run history written by the
      # previous run has to be carried over or source learning restarts at one run
      # every day. The key is unique per run so the cache is always written back,
      # and restore-keys picks up the most recent previous cache.
      - name: Restore source feedback history
        id: run-history-cache
        uses: actions/cache@v4
        with:
          path: data/run_history.json
          key: newsroom-run-history-${{ github.run_id }}
          restore-keys: |
            newsroom-run-history-

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Fetch RSS
        run: python scripts/fetch_rss.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Score articles
        run: python scripts/score_articles.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Validate newsroom output
        run: python scripts/validate_newsroom.py

      - name: Analyze source feedback
        run: python scripts/analyze_source_feedback.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
