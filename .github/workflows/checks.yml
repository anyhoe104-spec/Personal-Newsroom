name: Reader checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.cjs
      # The reader is built from the sample theme pack and synthetic articles;
      # real articles and learning data stay in the private repository.
      - run: python scripts/build_site.py
        env:
          NEWSROOM_CONFIG_DIR: ${{ github.workspace }}/themes/example
          NEWSROOM_STATE_DIR: ${{ github.workspace }}/tests/fixtures/state
      - run: node --check public/app.js && node --check public/learning.js && node --check public/sw.js
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
